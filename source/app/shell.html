/* Muse Reach visual polish — all interactions and layout remain unchanged. */

/* Flat, bordered permanent surfaces; raised shadow belongs to overlays only. */
.mark,.composer,.card,.task,.tool,.idea { box-shadow:none; }

/* Keep the 8px outer tab shell and its 4px inner controls parallel:
   8px - 4px inner padding = 4px. */
.filters{border-radius:8px}
.filters>.filter{border-radius:4px}

/* Consistent pointer / keyboard motion and visual response. */
button,
select,
input,
textarea,
a,
[role="switch"] {
  transition:
    background-color var(--motion-faster) var(--motion-ease-in),
    color var(--motion-faster) var(--motion-ease-in),
    border-color var(--motion-faster) var(--motion-ease-in),
    filter var(--motion-faster) var(--motion-ease-in),
    opacity var(--motion-faster) var(--motion-ease-in),
    transform var(--motion-faster) var(--motion-ease-in);
}
button:active:not(:disabled) { transform:scale(.98);filter:brightness(.94); }
button:focus-visible, select:focus-visible, input:focus-visible, textarea:focus-visible {
  outline:2px solid var(--accentBorder)!important;
  outline-offset:2px;
  box-shadow:none!important;
}
.history-item svg,.side-link svg,.log-glyph svg,.tag,.status,
.status::before,.log-arrow,.composer,.search,.notice,.attachment,
.toast,.toggle::before {
  transition:
    color var(--motion-faster) var(--motion-ease-in),
    background-color var(--motion-faster) var(--motion-ease-in),
    border-color var(--motion-faster) var(--motion-ease-in),
    transform var(--motion-faster) var(--motion-ease-in),
    opacity var(--motion-faster) var(--motion-ease-in);
}
/* The status dot is colored using currentColor, including paused/disconnected. */
.status::before {
  background-color:currentColor;
  box-shadow:0 0 0 3px color-mix(in srgb,currentColor 12%,transparent);
}
.status.dot-shift::before {
  animation:reach-dot-shift var(--motion-faster) var(--motion-ease-in) both;
}
@keyframes reach-dot-shift {
  from { background-color:var(--dot-from,currentColor); }
  to { background-color:currentColor; }
}

/* Scrollbar hover deepens the thumb without changing its width. */
::-webkit-scrollbar-thumb{
  transition:background-color var(--motion-faster) var(--motion-ease-in);
}
::-webkit-scrollbar-thumb:hover { background:rgba(139,153,166,.4); }

/* 4px page entrance; only applied on actual page changes. */
.view-enter { animation:reach-page-in var(--motion-fast) var(--motion-ease-in) both; }

  from { opacity:0; transform:translateY(4px); }
  to { opacity:1; transform:translateY(0); }

/* Newly appended items, not the entire history on every rerender. */

  animation:reach-item-in var(--motion-fast) var(--motion-ease-in) both;
}
@keyframes reach-item-in {
  from { opacity:0; transform:translateY(4px); }
  to { opacity:1; transform:translateY(0); }
}
.log-arrow{transition:transform var(--motion-faster) var(--motion-ease-in),color var(--motion-faster) var(--motion-ease-in)}

/* Real entrance and visual-only exit even though the app immediately unmounts
   the approval dialog's interactive DOM. The exit is a noninteractive clone. */
.backdrop { animation:reach-mask-in var(--motion-fast) var(--motion-ease-in) both; }
.backdrop .dialog { animation:reach-dialog-in var(--motion-fast) var(--motion-ease-in) both; }
.backdrop.visual-leaving { pointer-events:none;animation:reach-mask-out var(--motion-fast-exit) var(--motion-ease-out) both; }
.backdrop.visual-leaving .dialog { animation:reach-dialog-out var(--motion-fast-exit) var(--motion-ease-out) both; }
@keyframes reach-mask-in { from { opacity:0; }to { opacity:1; } }
@keyframes reach-mask-out { from { opacity:1; }to { opacity:0; } }
@keyframes reach-dialog-in {
  from { opacity:0; transform:scale(.96); }
  to { opacity:1; transform:scale(1); }
}
@keyframes reach-dialog-out {
  from { opacity:1; transform:scale(1); }
  to { opacity:0; transform:scale(.96); }
}
.notice {animation:reach-float-in var(--motion-fast) var(--motion-ease-in) both;}

  from{opacity:0;transform:translateY(-4px)}
  to{opacity:1;transform:translateY(0)}

/* Retain and extend the original reduced-motion contract. */
@media(prefers-reduced-motion:reduce){
  *,*::before,*::after{
    animation:none!important;
    transition:none!important;
    scroll-behavior:auto!important;

const selPill=document.createElement('div');selPill.className='sel-pill';selPill.setAttribute('aria-hidden','true');
let selPlaced=false;
function moveSelBar(){
  const side=$('#sidebar');if(!side)return;
  const active=side.querySelector('.side-link.active');
  if(!active){selPill.style.display='none';return;}
  if(selPill.parentNode!==side)side.insertBefore(selPill,side.firstChild);
  selPill.style.display='';

  if(!selPlaced){selPill.style.transition='none';set();void selPill.offsetWidth;selPill.style.transition='';selPlaced=true;}

  clearTimeout(moveSelBar._t);moveSelBar._t=setTimeout(()=>moveSelBar(),MOTION.normal);

<script id="reach-visual-polish">
(()=>{'use strict';
  const main=document.getElementById('main');
  const sidebar=document.getElementById('sidebar');
  const topbar=document.getElementById('topbar');
  const modalRoot=document.getElementById('modalRoot');
  const reduce=window.matchMedia('(prefers-reduced-motion: reduce)');
  const viewKey=()=>{
    const content=main.firstElementChild;
    return content?.classList.contains('chat')?'chat':content?.querySelector('.page-label')?.textContent||'other';
  };
  const sessionKey=()=>sidebar.querySelector('.history-item.active')?.getAttribute('data-id')||'';
  const getMsgs=()=>Array.from(main.querySelectorAll('#messages>.message,#messages>.tool'));
  const getPending=msgs=>msgs.map(el=>!!el.querySelector('.typing'));
  let lastView=viewKey(),lastSession=sessionKey(),lastMsgCount=getMsgs().length;
  let pending=getPending(getMsgs());
  let lastLogFilter='',logInitialized=false,logIds=new Set();
  
  
  const animate=el=>{if(el&&!reduce.matches)el.classList.add('item-enter')};
  let scheduled=false;
  function sync(){
    scheduled=false;
    const nowView=viewKey(),nowSession=sessionKey();
    if(nowView!==lastView){
      const content=main.firstElementChild;
      if(!reduce.matches)content?.classList.add('view-enter');
    }
    const messages=getMsgs();
    if(nowView==='chat'){
      if(nowSession===lastSession&&nowView===lastView){
        if(messages.length>lastMsgCount){
          messages.slice(lastMsgCount).forEach(animate);
        }else if(messages.length===lastMsgCount&&messages.length){
          for(let i=0;i<messages.length;i++){
            if(pending[i]&&!messages[i].querySelector('.typing'))animate(messages[i]);
          }
        }
      }
      lastMsgCount=messages.length;
      pending=getPending(messages);
      lastSession=nowSession;
    }
    const logList=main.querySelector('#logList');
    if(logList){
      const rows=Array.from(logList.querySelectorAll('.log-item'));
      const ids=rows.map(row=>row.querySelector('[data-action="expand"]')?.getAttribute('data-id'));
      const filter=(main.querySelector('.filter.selected')?.getAttribute('data-filter')||'all')+'|'+(main.querySelector('#logSearch')?.value||'');
      if(nowView!==lastView||filter!==lastLogFilter||!logInitialized){
        ids.forEach(id=>logIds.add(id));
        logInitialized=true;
      }else{
        rows.forEach((row,i)=>{if(!logIds.has(ids[i]))animate(row);logIds.add(ids[i]);});
      }
      lastLogFilter=filter;
    }
    lastView=nowView;
  }
  const schedule=()=>{
    if(scheduled)return;
    scheduled=true;
    queueMicrotask(sync);
  };
  const observer=new MutationObserver(schedule);
  observer.observe(main,{childList:true,subtree:true});
  observer.observe(sidebar,{childList:true,subtree:true});
  observer.observe(topbar,{childList:true,subtree:true});

  // Closing a dialog keeps only a visual (inert) 125ms exit layer (ControlFast exit + 30ms margin).
  // v26: 动效关时（body.no-anim）不建 ghost——v21 规矩是全部立即切换，ghost 的淡出动画被禁掉后会以不透明残留到定时器移除；与 prefers-reduced-motion 同处理。
  new MutationObserver(records=>{
    if(reduce.matches||document.body.classList.contains('no-anim')||modalRoot.querySelector('.backdrop,.minimized'))return;
    const removed=records.flatMap(record=>Array.from(record.removedNodes));
    const previous=removed.find(node=>node.nodeType===1&&node.matches?.('.backdrop'));
    if(!previous)return;
    const ghost=previous.cloneNode(true);
    ghost.removeAttribute('data-action');
    ghost.classList.add('visual-leaving');
    ghost.setAttribute('aria-hidden','true');
    ghost.inert=true;
    document.body.appendChild(ghost);
    setTimeout(()=>ghost.remove(),window.MOTION.fastExit+30); // v26: fastExit 取共享 token 表（与 MotionTokens.cs、CSS --motion-fast-exit 同步），不写字面时长
  }).observe(modalRoot,{childList:true});
})();
</script>
